<div class="task-list">
  <mat-card *ngFor="let task of tasks" [ngClass]="{'completed': task.completed}">
    <mat-card-title>{{ task.title }}</mat-card-title>
    <mat-card-content>{{ task.description }}</mat-card-content>
    
    <div class="buttons">
      <button mat-button color="primary" (click)="completeTask(task.id)" [disabled]="task.completed">
        ✅ Complete
      </button>
      <button mat-button color="warn" (click)="deleteTask(task.id)">🗑 Delete</button>
    </div>
  </mat-card>
</div>
